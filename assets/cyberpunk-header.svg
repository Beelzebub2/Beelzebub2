<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Beelzebub cyberpunk profile header">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#10243a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#070b12" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f5ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="250" rx="18" fill="#070b12"/>
  <rect x="1.5" y="1.5" width="897" height="247" rx="16.5" fill="url(#glow)" stroke="url(#border)" stroke-width="3"/>
  <rect x="12" y="12" width="876" height="226" rx="12" fill="url(#grid)"/>

  <path d="M30 45 H215 L235 25 H430" fill="none" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M470 225 H665 L685 205 H870" fill="none" stroke="#ff2e88" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="30" cy="45" r="4" fill="#00f5ff" filter="url(#cyanGlow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="205" r="4" fill="#ff2e88" filter="url(#pinkGlow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.1s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.7">
    <rect x="0" y="0" width="900" height="2" fill="#00f5ff">
      <animate attributeName="y" from="18" to="232" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="450" y="108" text-anchor="middle" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="3">BEELZEBUB</text>
  <text x="450" y="145" text-anchor="middle" fill="#79f7ff" font-family="Consolas, Menlo, monospace" font-size="18" letter-spacing="2">developer · automation · desktop tools · open source</text>
  <text x="450" y="184" text-anchor="middle" fill="#a6b2c3" font-family="Consolas, Menlo, monospace" font-size="14">Python  //  TypeScript  //  PowerShell  //  C++</text>

  <rect x="330" y="207" width="240" height="2" rx="1" fill="#222a38"/>
  <rect x="330" y="207" width="72" height="2" rx="1" fill="#00f5ff" filter="url(#cyanGlow)">
    <animate attributeName="x" values="330;498;330" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>