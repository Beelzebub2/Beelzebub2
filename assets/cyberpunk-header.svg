<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Beelzebub animated cyberpunk profile header">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.48" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f5ff"/>
      <stop offset="1" stop-color="#ff2e88" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#111b2c"/>
      <stop offset="0.55" stop-color="#090e18"/>
      <stop offset="1" stop-color="#05070c"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#00f5ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="14" y="14" width="872" height="252" rx="14"/></clipPath>
  </defs>

  <rect width="900" height="280" rx="18" fill="#05070c"/>
  <rect x="1.5" y="1.5" width="897" height="277" rx="16.5" fill="url(#bg)" stroke="url(#edge)" stroke-width="3"/>
  <rect x="14" y="14" width="872" height="252" rx="14" fill="url(#grid)"/>

  <g clip-path="url(#screen)" opacity="0.7">
    <rect x="14" y="0" width="872" height="2" fill="url(#pulse)">
      <animate attributeName="y" values="18;260" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="4.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="38" y="42" fill="#74f7ff" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="1.8">SESSION START</text>
  <circle cx="28" cy="38" r="4" fill="#00f5ff" filter="url(#cyanGlow)">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="862" y="42" text-anchor="end" fill="#9099aa" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="1.2">OPEN SYSTEMS // USER CONTROL</text>

  <path d="M30 72H205L224 53H332" fill="none" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.78"/>
  <circle cx="30" cy="72" r="3.5" fill="#00f5ff" filter="url(#cyanGlow)"/>
  <path d="M568 227H676L695 208H870" fill="none" stroke="#ff2e88" stroke-width="2" stroke-opacity="0.78"/>
  <circle cx="870" cy="208" r="3.5" fill="#ff2e88" filter="url(#pinkGlow)"/>

  <g>
    <text x="450" y="137" text-anchor="middle" fill="#00f5ff" opacity="0.13" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="5">BEELZEBUB
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0;-2 0;0 0" dur="5.8s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="137" text-anchor="middle" fill="#ff2e88" opacity="0.11" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="5">BEELZEBUB
      <animateTransform attributeName="transform" type="translate" values="0 0;-2 0;0 0;2 0;0 0" dur="6.4s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="137" text-anchor="middle" fill="#f5f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="5">BEELZEBUB</text>
  </g>

  <text x="450" y="171" text-anchor="middle" fill="#8ef8ff" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="1.9">desktop apps // automation // open source</text>
  <text x="450" y="198" text-anchor="middle" fill="#7f8b9f" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="1.2">Python · TypeScript · PowerShell · C++ · Qt · Electron</text>

  <rect x="300" y="228" width="300" height="4" rx="2" fill="#192231"/>
  <rect x="300" y="228" width="48" height="4" rx="2" fill="#00f5ff" filter="url(#cyanGlow)">
    <animate attributeName="x" values="300;552;300" dur="4.2s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="250" text-anchor="middle" fill="#5f6b7d" font-family="Consolas, Menlo, monospace" font-size="10" letter-spacing="1.5">BUILDING USEFUL THINGS OUTSIDE THE WALLED GARDEN</text>
</svg>