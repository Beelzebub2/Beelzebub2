<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img" aria-label="Stellaris Mod Manager project card">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ff2e88"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="440" height="150" rx="14" fill="#080d15" stroke="#253044"/>
  <rect x="1" y="1" width="438" height="148" rx="13" fill="none" stroke="url(#g)" stroke-opacity="0.72"/>
  <rect x="0" y="0" width="90" height="2" fill="#ff2e88" filter="url(#glow)"><animate attributeName="x" values="350;0;350" dur="5.4s" repeatCount="indefinite"/></rect>
  <text x="24" y="34" fill="#7c8799" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="1.4">DESKTOP APP</text>
  <text x="24" y="66" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Stellaris Mod Manager</text>
  <text x="24" y="94" fill="#aab5c4" font-family="Segoe UI, Arial, sans-serif" font-size="14">Profiles, load order, updates and compatibility tools.</text>
  <text x="24" y="126" fill="#ff77b4" font-family="Consolas, Menlo, monospace" font-size="12">Electron   React   TypeScript</text>
  <circle cx="405" cy="34" r="5" fill="#ff2e88" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
</svg>